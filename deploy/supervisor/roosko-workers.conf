; Worker delle code di Roosko (supervisor). Copiare in /etc/supervisor/conf.d/, sostituire /var/www/roosko
; e www-data, poi: supervisorctl reread && supervisorctl update.
; deploy.sh lancia `php artisan queue:restart`: supervisor fa ripartire i worker con il codice nuovo.

; Coda di default: stampe delle etichette e lavoro asincrono generico.
[program:roosko-worker]
command=php /var/www/roosko/laravel/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/roosko/laravel/storage/logs/worker.log

; Coda RENTRI: un tentativo per job (gli invii non si ripetono alla cieca) e timeout coerente con le chiamate.
; Il retry_after della connessione (DB_QUEUE_RETRY_AFTER, default 240) deve superare questo timeout.
[program:roosko-rentri]
command=php /var/www/roosko/laravel/artisan queue:work --queue=rentri --sleep=3 --tries=1 --timeout=180 --max-time=3600
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/var/www/roosko/laravel/storage/logs/worker-rentri.log
