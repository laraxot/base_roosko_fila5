# FixCity Local Development VirtualHost Configuration - HTTPS
# Server: fixcity.local
# Document Root: public_html
# Last Updated: 2026-10-07
#
# SSOT: This file is the canonical vhost config.
# Deploy: sudo cp laravel/config/vhost/fixcity.local-ssl.conf /etc/apache2/sites-available/
# Enable: sudo a2ensite fixcity.local-ssl && sudo a2enmod ssl && sudo systemctl reload apache2
#
# Prerequisites:
# 1. Install mkcert: https://github.com/FiloSottile/mkcert
# 2. Generate certs: mkcert -install && mkcert fixcity.local www.fixcity.local
# 3. Place certs in /etc/apache2/ssl/fixcity.local/

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName fixcity.local
    ServerAlias www.fixcity.local

    DocumentRoot /var/www/_bases/base_fixcity_fila5/public_html

    <Directory /var/www/_bases/base_fixcity_fila5/public_html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/fixcity.local/fixcity.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/fixcity.local/fixcity.local-key.pem

    # Modern SSL config
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # HSTS (uncomment for production)
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/fixcity.local-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/fixcity.local-ssl-access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>
</VirtualHost>
</IfModule>

# /etc/hosts entry:
# 127.0.0.1 fixcity.local www.fixcity.local