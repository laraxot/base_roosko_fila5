name: Tests

# Suite Pest dei moduli di Roosko su sqlite, come in sviluppo: un job per modulo, cosi' un
# modulo rosso non nasconde gli altri. Il DB di test e' il file condiviso database/test_data.sqlite
# che XotBaseTestCase usa per tutte le connessioni (la connessione `user` ci punta con un symlink).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        module: [Labeling, Weighing, Warehouse, Processing, Waste, Rentri, Roosko]
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, sqlite3, pcntl, posix, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('laravel/composer.json', 'laravel/Modules/*/composer.json') }}
          restore-keys: composer-files-

      - name: Install dependencies
        # composer.lock non e' versionato: la risoluzione avviene qui.
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          composer dump-autoload

      - name: Environment
        run: |
          cat > .env <<'ENV'
          APP_NAME=Roosko
          APP_ENV=local
          APP_DEBUG=true
          APP_URL=http://roosko.local
          DB_CONNECTION=sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          LOG_CHANNEL=single
          ENV
          cat > .env.testing <<'ENV'
          APP_NAME=Roosko
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://roosko.local
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          LOG_CHANNEL=single
          LOG_LEVEL=error
          ENV
          php artisan key:generate --force
          php artisan key:generate --force --env=testing

      - name: Test database
        run: |
          rm -f database/test_data.sqlite database/test_user.sqlite
          touch database/test_data.sqlite
          ln -s test_data.sqlite database/test_user.sqlite
          DB_DATABASE=test_data DB_DATABASE_USER=test_user php artisan migrate --force --no-interaction

      - name: Pest
        run: php vendor/bin/pest Modules/${{ matrix.module }}/tests

  phpstan:
    name: PHPStan moduli di dominio
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('laravel/composer.json', 'laravel/Modules/*/composer.json') }}
          restore-keys: composer-files-

      - name: Install dependencies
        run: |
          mkdir -p bootstrap/cache
          composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: PHPStan (config unica laravel/phpstan.neon)
        run: |
          php vendor/bin/phpstan analyse --memory-limit=2G --no-progress \
            Modules/Roosko/app Modules/Warehouse/app Modules/Processing/app Modules/Weighing/app \
            Modules/Labeling/app Modules/Waste/app Modules/Rentri/app
